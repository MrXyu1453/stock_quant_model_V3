# 复制本文件为 config/config.yaml 后按需修改。
#   Windows:  copy config\config.example.yaml config\config.yaml
#   macOS/Linux: cp config/config.example.yaml config/config.yaml
# config/config.yaml 含个人凭据，已被 .gitignore 排除，不会上传到 Git。

tushare:
  # tushare token（使用 tushare 数据源必填）：
  #   1. 到 https://tushare.pro 注册账号
  #   2. 登录后进入「个人主页 → 接口 TOKEN」，复制到下方
  #   3. 也可以不写在这里，改为设置环境变量 TUSHARE_TOKEN（推荐，避免凭据落盘）
  # 留空时 tushare 数据源不可用，应用自动使用免费数据源 baostock（无需注册）
  token: ''
  request_delay: 1.3        # API 请求间隔（秒），避免触发接口频率限制

database:
  name: 'stock_codes.db'    # SQLite 数据库文件（相对项目根目录，首次运行自动创建）

cache:
  expiration: 21600         # Redis K线缓存过期时间（秒），默认 6 小时

data_source:
  default: 'tushare'        # 默认数据源：tushare / baostock
  available:
    - 'tushare'
    - 'baostock'
